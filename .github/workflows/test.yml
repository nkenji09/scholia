name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # TestRetrofitDogfoodCounts の decision-stale 検出が git log 全履歴を
          # 辿るため、shallow clone だとローカルと異なる（少ない）件数になり偽陽性で fail する
          # （#45 D6/D7 導入以降、束4 merge から本ジョブが shallow clone で継続的に赤くなっていた）。

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # ⚠️ **`-race` を別ステップで必ず走らせる。** viewer は 2026-08-04 から
      # スナップショットと派生 index を**プロセス全体で1つ共有**するようになった
      # （decision 01KZ5N5CJ2VFMZAGSFPSCZAMTZ 条項2）。共有前は無害だった
      # 「取り出したスライスをその場で並べ替える」1行が、共有後は**別の要求の
      # 応答を壊す**。それを落とす歯止め（TestIndexCache_ConcurrentReadsShareSnapshot）
      # は `-race` と対でしか歯が立たない——`go test ./...` だけでは、実際に
      # 共有スライスを in-place ソートする変異を入れても**緑のまま通る**（実測）。
      # ここを外すと歯止めが自称どおりに落ちなくなる（CLAUDE.md 6）。
      - name: go test -race
        run: go test -race ./...

      - name: gofmt
        run: |
          diff="$(gofmt -l .)"
          if [ -n "$diff" ]; then
            echo "gofmt needs to be run on the following files:"
            echo "$diff"
            exit 1
          fi

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      # web/tsconfig.json はソリューション構成（"files": []）なので `tsc --noEmit`
      # 単体では対象ファイル数 0 で実質 no-op になる（プロジェクト参照を辿らない）。
      # `-b` でプロジェクト参照（tsconfig.app.json/tsconfig.node.json）を辿らせて
      # 実際に型検査させる。leaf 側で既に noEmit: true のため成果物は生成しない。
      - name: tsc -b --noEmit
        working-directory: web
        run: npx tsc -b --noEmit

      - name: test
        working-directory: web
        run: npm test

      - name: build
        working-directory: web
        run: npm run build

      # committed web/dist is the canonical embed source (go:embed); the local darwin
      # build is the authority normalized by hand at merge time. This step is a
      # best-effort drift check only: CI runs on ubuntu-latest (cross-platform from
      # the darwin authority), and byte-identical output across OSes is not guaranteed
      # (rolldown/mermaid chunk hashes). continue-on-error keeps this from failing the
      # job on a false positive — it only surfaces drift for a human to look at; the
      # build itself (tsc/vite above) still fails the job on real breakage.
      - name: verify web/dist matches committed build
        continue-on-error: true
        run: git diff --exit-code -- web/dist

  scholia-invariants:
    name: scholia invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # shallow clone では origin/<base> が解決できないため必須（#45 U4）

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build scholia
        run: go build -o /tmp/scholia ./cmd/scholia

      # decision の append-only 防衛（欄位単位・#45 U4）。push(main) では base が
      # 無いため PR のみ。#42 型の全店 retrofit は PR label
      # decision-retrofit-approved による明示の例外承認（env の値＝理由として
      # 出力に記録される）＋例外承認の decision 記録を必須とする運用規約。
      - name: decisions append-only (diff --check)
        if: github.event_name == 'pull_request'
        env:
          SCHOLIA_ALLOW_DECISION_RETROFIT: ${{ contains(github.event.pull_request.labels.*.name, 'decision-retrofit-approved') && 'PR label decision-retrofit-approved' || '' }}
        run: /tmp/scholia diff --check "origin/${{ github.base_ref }}"

      # warn の歯止め（ratchet・#45 U4）。error は常に fail・baseline
      # （.scholia/lint-baseline.json）に無い新規 warn のみ fail。baseline 不在の
      # 間は非活性（error のみ fail）。
      - name: lint ratchet (lint --ci)
        run: /tmp/scholia lint --ci
